server:
  port: 8080
spring:
  output:
    ansi:
      enabled: ALWAYS
  profiles:
    active: prod
  config:
    import: optional:application-secret.yml
  datasource:
    url: jdbc:mysql://localhost:3306/dt
    username: dt
    password: dt1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.dd.blog: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.jdbc.extract: WARN
    org.springframework.transaction.interceptor: WARN

custom:
  site:
    cookie:
      secure: false
      sameSite: Lax
    cookieDomain: localhost
    frontUrl: "http://localhost:3000"
    backUrl: "http://localhost:${server.port}"

  aws:
    region: ap-northeast-2
    s3:
      bucket: your-private-bucket-name
    presign:
      put-minutes: 10
      get-minutes: 5