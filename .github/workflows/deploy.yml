name: deploy

on:
  push:
    paths:
      - ".github/workflows/**"
      - "backend/src/**"
      - "backend/build.gradle.kts"
      - "backend/settings.gradle.kts"
      - "backend/Dockerfile"
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  makeTagAndRelease:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.create_tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Create Tag
        id: create_tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.create_tag.outputs.new_tag }}
          release_name: Release ${{ steps.create_tag.outputs.new_tag }}
          body: ${{ steps.create_tag.outputs.changelog }}
          draft: false
          prerelease: false

  buildImageAndPush:
    runs-on: ubuntu-latest
    needs: makeTagAndRelease
    permissions:
      contents: read
      packages: write

    # ✅ 변경 1) 이미지 이름을 repo 이름으로 자동 설정 (bearlink 제거)
    env:
      DOCKER_IMAGE_NAME: ${{ github.event.repository.name }}

    outputs:
      DOCKER_IMAGE_NAME: ${{ env.DOCKER_IMAGE_NAME }}
      OWNER_LC: ${{ steps.ownerlc.outputs.owner_lc }}

    steps:
      - uses: actions/checkout@v4

      - name: Create application-secret.yml
        env:
          APPLICATION_SECRET: ${{ secrets.APPLICATION_SECRET_YML }}
        run: echo "$APPLICATION_SECRET" > backend/src/main/resources/application-secret.yml

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        id: ownerlc
        run: echo "owner_lc=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ steps.ownerlc.outputs.owner_lc }}/${{ env.DOCKER_IMAGE_NAME }}:${{ needs.makeTagAndRelease.outputs.tag_name }}
            ghcr.io/${{ steps.ownerlc.outputs.owner_lc }}/${{ env.DOCKER_IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [buildImageAndPush]
    env:
      DOCKER_IMAGE_NAME: ${{ needs.buildImageAndPush.outputs.DOCKER_IMAGE_NAME }}
      OWNER_LC: ${{ needs.buildImageAndPush.outputs.OWNER_LC }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Get EC2 Instance ID
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=dev2-ec2-1" "Name=instance-state-name,Values=running" --query "Reservations[].Instances[].InstanceId" --output text)
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      - name: Deploy via SSM
        uses: peterkimzz/aws-ssm-send-command@master
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          instance-ids: ${{ env.INSTANCE_ID }}
          working-directory: /
          comment: Deploy
          command: |
            IMAGE="ghcr.io/${{ env.OWNER_LC }}/${{ env.DOCKER_IMAGE_NAME }}:latest"
            VOLUME="/gen:/gen"
            NETWORK="common"
            HEALTH_ENDPOINT="/actuator/health"
            TIMEOUT=60

            if docker ps --format '{{.Names}}' | grep -q "app1_1"; then
              CURRENT="app1_1"
              NEXT="app1_2"
              NEXT_PORT=8081
            else
              CURRENT="app1_2"
              NEXT="app1_1"
              NEXT_PORT=8080
            fi

            docker pull "$IMAGE"

            docker stop "$NEXT" 2>/dev/null || true
            docker rm "$NEXT" 2>/dev/null || true

            docker run -d \
              -v "$VOLUME" \
              --network "$NETWORK" \
              --name "$NEXT" \
              -p "$NEXT_PORT":8080 \
              -e SPRING_DATA_REDIS_HOST=redis_1 \
              -e SPRING_DATA_REDIS_PORT=6379 \
              "$IMAGE"

            START_TIME=$(date +%s)
            while true; do
              CONTENT=$(curl -s "http://localhost:$NEXT_PORT$HEALTH_ENDPOINT")

              if [[ "$CONTENT" == *'"status":"UP"'* ]]; then
                break
              fi

              ELAPSED_TIME=$(( $(date +%s) - START_TIME ))
              if [[ $ELAPSED_TIME -ge $TIMEOUT ]]; then
                docker logs "$NEXT"
                docker stop "$NEXT" 2>/dev/null || true
                docker rm "$NEXT" 2>/dev/null || true
                exit 1
              fi

              sleep 5
            done

            sleep 10

            docker stop "$CURRENT" 2>/dev/null || true
            docker rm "$CURRENT" 2>/dev/null || true

            docker rmi $(docker images -f "dangling=true" -q) 2>/dev/null || true
